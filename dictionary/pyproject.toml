[project]
name = "rimario-build"
version = "0.1.0"
description = "Builds the Super Rimario Italiano dictionary: stress, homographs and frequencies of Italian word forms"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"                # process pools rely on the forkserver default
dependencies = [
    "polars>=1.30",
    "orjson>=3.10",
    "wordfreq==3.1.1",
    "scikit-learn>=1.6",
    "numpy>=2.2",
    "scipy>=1.15",
]

[project.scripts]
rimario-build = "rimario_build.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rimario_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
