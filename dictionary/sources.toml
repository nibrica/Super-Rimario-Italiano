# Sources of the dictionary build (OVERHAUL-PLAN §1, §2).
#
# Read by fetch.py (download) and export.py (out/ATTRIBUTION.md, together with
# sources.lock.json, which records the version actually used).
#
# One [[source]] table per source, in attribution order:
#
#   id            directory under data/raw/ and key in sources.lock.json;
#                 the "source" value in every table the build produces
#   name          human-readable name
#   provides      what the build takes from it (one line)
#   resolver      how the latest version is found:
#                   "http"     fixed URL, re-downloaded only when its ETag /
#                              Last-Modified changes (conditional GET)
#                   "leipzig"  `url` contains {year}: probe from the current year
#                              down to `min_year` and use only the newest that exists
#                   "package"  an installed Python dependency (`package`); its
#                              version is recorded, nothing is downloaded
#   url           download URL (http), URL pattern with {year} (leipzig), or
#                 the package's index page (package)
#   file          local file name under data/raw/<id>/ (may contain {year})
#   min_year      leipzig only: oldest year to probe
#   package       package only: distribution name
#   mirror        optional: path (relative to dictionary/) of an unchanged copy
#                 committed in this repository, redistributed under the
#                 source's licence. fetch.py restores it into data/raw/<id>/
#                 when upstream can't serve the file and there is no local
#                 copy, and records "via": "mirror" in the lock.
#   mirror_sha256 sha256 of the mirror file (verified on every restore)
#   mirror_last_modified  upstream Last-Modified of the mirrored version; a
#                 different upstream value means the mirror needs refreshing
#   homepage      page describing the resource
#   license       licence name; license_url: its text
#   attribution   credit line to reproduce wherever the data is shown
#   [[source.cite]]  works to cite: `text` (full reference), optional `url`
#
# Every source must be redistributable and usable commercially inside a GPL
# project, and downloadable automatically.

